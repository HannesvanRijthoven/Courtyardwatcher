name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi
      - run: python probe/probe.py | tee probe/out-log.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -b probe-results
          git add -f probe/out probe/out-log.txt
          git commit -qm "probe results"
          git push -f origin probe-results
